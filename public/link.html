<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household — Family HelpDesk</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="help-skin.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .link-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.75rem 0; border-top: 1px solid var(--border); }
    .link-row:first-child { border-top: 0; padding-top: 0; }
    .link-who { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .link-name { font-weight: 600; overflow-wrap: anywhere; }
    .link-role { color: var(--text-muted); font-size: 0.85rem; }
    .link-row select { flex: 1 1 14rem; width: auto; max-width: 22rem; min-width: 0; font-size: 1rem; }
    /* On a phone every picker sits under its name, whatever the name's length. */
    @media (max-width: 520px) { .link-row select { flex-basis: 100%; max-width: none; } }
    .link-note { flex-basis: 100%; margin: 0; font-size: 0.85rem; color: var(--text-muted); }
    .link-actions { display: flex; justify-content: flex-end; }
  </style>
</head>
<body>
  <header>
    <h1><span>?!</span> Family HelpDesk</h1>
    <div class="header-right"></div>
  </header>

  <main class="container">
    <div class="card">
      <h2 style="margin-bottom:0.5rem;">Who is who</h2>
      <p style="color:var(--text-muted);line-height:1.6;margin-bottom:1rem;">
        Family HelpDesk now knows people by their household account in Home Base.
        Match each HelpDesk member to the person they are. Anyone you leave unlinked
        is asked to find a parent when they open Family HelpDesk.
      </p>
      <div id="linkStatus" class="setup-status setup-info">Loading household members…</div>
    </div>

    <div class="card">
      <div id="linkRows"></div>
    </div>

    <div class="card link-actions" id="linkDoneCard" style="display:none;">
      <a href="./" class="btn btn-primary" id="linkDone">Open Family HelpDesk</a>
    </div>
  </main>

  <script src="link.js"></script>
</body>
</html>
